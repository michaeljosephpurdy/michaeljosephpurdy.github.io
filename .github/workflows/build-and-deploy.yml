name: Scrape, build, and prep for deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 0'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Scrape itch.io
        run: npm run scrape
      - name: Build
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: mikepurdy.dev
          publish_branch: deploy
